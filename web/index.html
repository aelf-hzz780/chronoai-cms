<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoAI Publishing</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><a href="/" class="brand">ChronoAI <span>Publishing</span></a><nav><a href="/auth/login" id="login">Sign in with NyxID</a><button id="logout" hidden>退出</button></nav></header>
<main><section id="welcome"><p class="eyebrow">个人与组织 · EN / 中文</p><h1>让每篇文章，<br>以正确的身份发布。</h1><p>保留 Markdown 原文，独立管理双语版本与发布渠道。</p></section>
<p id="notice" role="status" aria-live="polite"></p><section id="workspace" hidden>
<div class="bar"><label>Publish as <select id="owner"></select></label><button id="new">新文章</button><label>搜索 <input id="search" type="search"></label><button id="refresh">刷新</button></div>
<div class="layout"><aside><h2>文章</h2><div id="articles"></div></aside><section class="editor"><h2 id="editor-heading">新建草稿</h2>
<label>标题<input id="title" maxlength="250" required></label><div class="bar"><label>署名作者<input id="author" maxlength="200" required></label><label>语言<select id="language"><option value="en">English</option><option value="zh">简体中文</option></select></label></div>
<label>Markdown 原文<textarea id="markdown" rows="19" spellcheck="false"></textarea></label><div class="bar"><label class="file">导入 .md<input id="import" type="file" accept=".md,text/markdown"></label><label class="file">上传私有图片<input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label></div>
<div class="bar"><button id="save" class="primary">保存新修订</button><button id="submit">提交当前版本</button><button id="preview">私有预览</button><button id="export">下载原文</button></div>
<p id="revision"></p><details><summary>修订历史与关联译文</summary><div id="history"></div><label>原文文章<select id="source-article"></select></label><label>原文版本<select id="source-revision"></select></label><button id="link-translation">关联此译文</button></details>
<iframe id="preview-frame" title="私有 Markdown 预览" sandbox="allow-same-origin" hidden></iframe>
<section id="publishing"><h3>发布与分发</h3><p>发布确认固定当前版本、owner 与署名；后续编辑不会修改线上文章。</p><label><input id="rights" type="checkbox">已确认文字及图片发布权利</label><div class="bar"><button id="publish">确认发布原文</button><button id="update">确认更新原文</button><button id="unpublish">下线原文</button><button id="status">刷新状态</button><button id="cancel-original">取消待发原文</button><button id="reconcile-original">对账原文结果</button><button id="sync-links">同步已发布译文链接</button></div><div id="releases"></div>
<details><summary>分发与副本管理</summary><label>已确认的原文版本<select id="release-id"></select></label><div class="bar"><label>目的地<select id="target"><option value="dev">DEV（自动）</option><option value="hashnode">Hashnode 组织 Pro（自动）</option><option value="medium">Medium（辅助导入）</option><option value="hackernoon">HackerNoon（辅助投稿）</option></select></label><label>动作<select id="delivery-action"><option value="create">新建</option><option value="update">纠错</option><option value="remove">移除</option></select></label><label>形式<select id="delivery-format"><option value="full">全文</option><option value="excerpt">摘要</option></select></label></div><label>NyxID 连接<select id="connection-id"></select></label><label>已有副本（纠错／移除）<select id="copy-id"></select></label><label>摘要内容<textarea id="excerpt" rows="3"></textarea></label><button id="distribute">确认请求分发</button><p>组织自动写入还需 NyxID Admin 对确切内容、目标和动作授权。连接失败后请重连所选账号。</p>
<label>待处理分发<select id="delivery-id"></select></label><label>NyxID 精确批准引用<input id="approval-ref"></label><div class="bar"><button id="request-approval">请求 NyxID Admin 精确批准</button><button id="authorize">关联精确批准</button><button id="cancel-delivery">取消未发送任务</button><button id="reconcile-delivery">对账不确定结果</button><button id="package">获取投稿／跟进材料</button><button id="refresh-external-metrics">更新授权平台指标</button></div><label>人工流程状态<select id="manual-state"><option value="submitted">已提交</option><option value="reviewing">审核中</option><option value="rejected">未接受</option><option value="published">公开核验已发布</option><option value="removed">公开核验已移除</option><option value="manual_action_needed">待人工跟进</option></select></label><label>投稿或公开 URL<input id="manual-url" type="url"></label><button id="manual-report">记录人工流程结果</button><pre id="submission-package"></pre><div id="deliveries"></div></details></section>
</section></div><section><h2>阅读与分发指标</h2><div class="bar"><label>开始日期<input id="metric-from" type="date"></label><label>结束日期<input id="metric-to" type="date"></label><label>文章 ID<select id="metric-article"><option value="">全部文章</option></select></label><label>语言<select id="metric-language"><option value="">全部</option><option value="en">English</option><option value="zh">中文</option></select></label><label>目标<select id="metric-target"><option value="ghost">Ghost</option><option value="dev">DEV</option><option value="hashnode">Hashnode</option><option value="medium">Medium</option><option value="hackernoon">HackerNoon</option></select></label><button id="metrics">查询指标</button></div><div id="metric-result" aria-live="polite"></div></section><details><summary>组织发布权限管理（Admin）</summary><label>成员 subject<input id="publisher-subject"></label><label><input id="publisher-enabled" type="checkbox">Can publish</label><button id="role-save">保存发布权限</button></details>
</section></main><footer>Ghost 原版自托管 · 公开页面独立运行 · 私有草稿受权限保护</footer></body></html>
