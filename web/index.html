<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoAI Publishing</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><a href="/" class="brand">ChronoAI <span>Publishing</span></a><nav><a href="/auth/login" id="login">Sign in with NyxID</a><button id="logout" hidden>退出</button></nav></header>
<main><section id="welcome"><p class="eyebrow">个人与组织 · EN / 中文</p><h1>让每篇文章，<br>以正确的身份发布。</h1><p>保留 Markdown 原文，独立管理双语版本与发布渠道。</p></section>
<p id="notice" role="status" aria-live="polite"></p><section id="workspace" hidden>
<div class="bar"><label>Publish as <select id="owner"></select></label><button id="new">新文章</button><label>搜索 <input id="search" type="search"></label><button id="refresh">刷新</button></div>
<div class="layout"><aside><h2>文章</h2><div id="articles"></div></aside><section class="editor"><h2 id="editor-heading">新建草稿</h2>
<label>标题<input id="title" maxlength="250" required></label><div class="bar"><label>署名作者<input id="author" maxlength="200" required></label><label>语言<select id="language"><option value="en">English</option><option value="zh">简体中文</option></select></label></div>
<label>Markdown 原文<textarea id="markdown" rows="19" spellcheck="false"></textarea></label><div class="bar"><label class="file">导入 .md<input id="import" type="file" accept=".md,text/markdown"></label><label class="file">上传私有图片<input id="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label></div>
<div class="bar"><button id="save" class="primary">保存新修订</button><button id="submit">提交当前版本</button><button id="preview">私有预览</button><button id="export">下载原文</button></div>
<p id="revision"></p><details><summary>修订历史与关联译文</summary><div id="history"></div><label>原文 article ID<input id="source-article"></label><label>原文 revision ID<input id="source-revision"></label><button id="link-translation">关联此译文</button></details>
<iframe id="preview-frame" title="私有 Markdown 预览" sandbox="allow-same-origin" hidden></iframe>
<section id="publishing"><h3>发布与分发</h3><p>发布确认固定当前版本、owner 与署名；后续编辑不会修改线上文章。</p><label><input id="rights" type="checkbox">已确认文字及图片发布权利</label><div class="bar"><button id="publish">确认发布原文</button><button id="unpublish">下线原文</button></div><div id="releases"></div></section>
</section></div><section><h2>阅读与分发指标</h2><div class="bar"><label>开始日期<input id="metric-from" type="date"></label><label>结束日期<input id="metric-to" type="date"></label><button id="metrics">查询指标</button></div><pre id="metric-result"></pre></section>
</section></main><footer>Ghost 原版自托管 · 公开页面独立运行 · 私有草稿受权限保护</footer></body></html>
